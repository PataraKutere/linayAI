name: LinayAI quality checks

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "index.html"
      - "tests/**"
      - ".github/workflows/linay-ai-tests.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

concurrency:
  group: linayai-live-smoke-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Check test syntax
        run: node --check tests/worker-smoke.mjs
      - name: Check inline browser scripts
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const html=fs.readFileSync("index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(x=>x.trim()); for (const [i,src] of scripts.entries()) new Function(src); console.log("PASS "+scripts.length+" inline scripts");'
      - name: Check frontend feature wiring
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const h=fs.readFileSync("index.html","utf8"); const required=["id=\\"research\\"","function createProject()","function saveProject()","function deleteProject()","function moveChatToProject(","function bookmarkMessage(","function showSaved()","Yanıtı kes ve konuş","ARAŞTIRMA MODU:","S.cfg.research||explicitSearch","function clearMemory()","id=\\"responseStyle\\"","id=\\"responseLength\\"","YANIT TERCİHİ:"]; const missing=required.filter(x=>!h.includes(x)); if(missing.length) throw new Error("Missing frontend feature wiring: "+missing.join(", ")); console.log("PASS frontend feature wiring: "+required.length+" checks");'
      - name: Check live independent sports search
        run: |
          node --input-type=module -e 'const q="France Türkiye football match 15 November 2026 final score result"; const u="https://snowy-meadow-02d9.28berat28.workers.dev/search?q="+encodeURIComponent(q); const r=await fetch(u,{headers:{Origin:"https://patarakutere.github.io"}}); const j=await r.json(); if(!r.ok) throw new Error(JSON.stringify(j)); const a=j.results||[]; const ok=a.some(x=>/\b\d{1,2}\s*[-–:]\s*\d{1,2}\b/.test((x.title||"")+" "+(x.snippet||""))||/tff.org|sofascore|flashscore/i.test(x.url||"")); if(!ok) throw new Error("No relevant football score source: "+JSON.stringify(j)); console.log("PASS live sports search: "+j.provider+" ("+a.length+" results)");'

  smoke-tests:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test live LinayAI Worker
        run: node tests/worker-smoke.mjs
