 #bar{width:calc(100% - 18px);margin:6px auto 9px;padding:7px;gap:3px;border-radius:14px}

$('web').title="Web'de ara — Google Arama ile güncel kaynakları yanıta ekle";
$('web').setAttribute('aria-label',"Web'de ara");
$('web').onclick=()=>{S.cfg.search=!S.cfg.search;$('web').classList.toggle('on',S.cfg.search);save()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('mic').onclick=()=>{
 if(!SR)return alert('Bu tarayıcı sesle yazmayı desteklemiyor.');
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='tr-TR';
 rec.onresult=e=>{inp.value+=(inp.value?' ':'')+e.results[0][0].transcript;grow()};
 rec.onend=()=>{rec=null;$('mic').classList.remove('on')};rec.start();$('mic').classList.add('on');
};
$('msgs').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const codeBlock=b.closest('.code');
 const code=codeBlock.querySelector('code').innerText;
 if(b.dataset.a=='cp'){
  navigator.clipboard.writeText(code);b.textContent='Kopyalandı';setTimeout(()=>b.textContent='Kopyala',1200);
 }else if(b.dataset.a=='dl'){
  const lang=(codeBlock.querySelector('.ch span').innerText.trim()||'txt').toLowerCase();
  const ext=lang==='html'||lang==='svg'?lang:lang==='python'||lang==='py'?'py':lang==='javascript'||lang==='js'?'js':'txt';
  const blob=new Blob([code],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`linay-kod.${ext}`;a.click();
  URL.revokeObjectURL(url);
 }else{
  $('pvf').srcdoc=code;$('pv').showModal();
 }
});
let pullStartY=0,pullArmed=false,pullBusy=false;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0],m=$('msgs');pullStartY=t.clientY;pullArmed=t.clientY<145&&m.scrollTop<=0&&!pullBusy},{passive:true});
document.addEventListener('touchmove',e=>{if(!pullArmed||e.touches.length!==1)return;const d=e.touches[0].clientY-pullStartY;if(d>8){e.preventDefault();if(d>40)$('pullHint').classList.add('show')}},{passive:false});
document.addEventListener('touchend',e=>{if(!pullArmed)return;pullArmed=false;const t=e.changedTouches[0];if(t.clientY-pullStartY>95&&!pullBusy){pullBusy=true;$('pullHint').classList.add('show');setTimeout(()=>location.reload(),180)}else $('pullHint').classList.remove('show')},{passive:true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
