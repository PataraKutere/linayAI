<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linay">
<title>Linay</title>
<style>
:root{color-scheme:dark;--bg:#0d0d0f;--fg:#d6d3cc;--mu:#8a8892;--card:#151518;--bd:#26262b;--ac:#8c74cf;--ub:#1e1e23}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,sans-serif;display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,textarea,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:8px}
button:hover{background:var(--ub)}
#side{width:270px;background:#101013;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0}
#list{flex:1;overflow:auto}
.ci{display:flex;align-items:center;border-radius:8px}.ci.on{background:var(--ub)}
.ci span{flex:1;padding:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:14px}
.nb{background:linear-gradient(135deg,#8c74cf,#6a56b8);border-radius:12px;padding:11px;font-weight:500;color:#fff;text-align:center}
.nb:hover{opacity:.9}
#q{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;outline:0}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border:0}
header b{font-weight:600}
header select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:16px 12px}
.w{max-width:760px;margin:0 auto 14px}
.u{background:var(--ub);padding:11px 16px;border-radius:18px 18px 4px 18px;margin-left:auto;width:fit-content;max-width:90%;white-space:pre-wrap;word-break:break-word}
.a{word-break:break-word;line-height:1.7}
.a p{margin:8px 0}
.a h1,.a h2,.a h3{margin:16px 0 6px;font-weight:600}
.a h1{font-size:1.4em}.a h2{font-size:1.2em}.a h3{font-size:1.05em}
.a table{border-collapse:collapse;display:block;overflow-x:auto}
.a th,.a td{border:1px solid var(--bd);padding:6px 10px}
.a blockquote{border-left:3px solid var(--ac);margin:8px 0;padding:2px 14px;color:var(--mu)}
.code{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:12px 0;background:#0b0b0d}
.code .ch{display:flex;justify-content:space-between;align-items:center;padding:3px 6px 3px 14px;background:var(--card);font-size:12px;color:var(--mu)}
.code .ch div{display:flex;gap:4px;align-items:center}
.code .ch button{position:static;font-size:12px;background:none;color:var(--mu);padding:4px 8px}
.code .ch button:hover{background:var(--ub);color:var(--fg)}
.code pre{border:0;border-radius:0;background:#0b0b0d;padding:14px;margin:0;overflow-x:auto}
