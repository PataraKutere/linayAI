<style>:root{color-scheme:dark;--bg:#090711;--fg:#f4efff;--mu:#a79bbd;--card:#171126;--bd:#302344;--ac:#a77bff;--ub:#211832}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 54% -18%,#38205f 0%,#171025 34%,#090711 72%);color:var(--fg);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,textarea,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:8px 10px;border-radius:12px;transition:background .18s,border-color .18s,transform .18s}button:hover{background:#34234d}
#side{width:278px;background:linear-gradient(180deg,#130d20f5,#0e0a17f5);border-right:1px solid #ffffff12;display:flex;flex-direction:column;padding:16px 13px;gap:10px;flex-shrink:0;backdrop-filter:blur(22px)}#list{flex:1;overflow:auto}.ci{display:flex;align-items:center;border-radius:11px;margin:3px 0;border:1px solid transparent}.ci.on{background:#9c6cff1b;border-color:#a77bff35}.ci span{flex:1;padding:9px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:13px;color:#d8cde9}.ci button{color:#9584ae}
.nb{background:linear-gradient(120deg,#a77bff,#7044d1);border:1px solid #c9adff66;border-radius:13px;padding:11px;font-weight:650;color:white;text-align:center;box-shadow:0 7px 24px #7e4bd34a}.nb:hover{filter:brightness(1.12);transform:translateY(-1px)}#q{width:100%;padding:10px 13px;background:#ffffff09;border:1px solid #ffffff18;border-radius:12px;outline:0;font-size:13px}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}header{display:flex;align-items:center;gap:10px;padding:15px 22px;border-bottom:1px solid #ffffff0d;background:#0e0918a8;backdrop-filter:blur(18px)}header b{font-weight:700;letter-spacing:.2px}#menu{display:none}
#msgs{flex:1;overflow:auto;padding:24px 18px 18px;scroll-behavior:smooth}.w{max-width:820px;margin:0 auto 20px}.u{background:linear-gradient(135deg,#56358b,#39245d);border:1px solid #b38aff38;padding:12px 16px;border-radius:18px 18px 5px 18px;margin-left:auto;width:fit-content;max-width:88%;white-space:pre-wrap;word-break:break-word;box-shadow:0 8px 26px #0002}
.a{word-break:break-word;line-height:1.75;color:#eee7fb}.a p{margin:8px 0}.a h1,.a h2,.a h3{margin:17px 0 7px;font-weight:650}.a h1{font-size:1.4em}.a h2{font-size:1.2em}.a h3{font-size:1.05em}.a table{border-collapse:collapse;display:block;overflow-x:auto}.a th,.a td{border:1px solid var(--bd);padding:6px 10px}.a blockquote{border-left:3px solid var(--ac);margin:8px 0;padding:2px 14px;color:var(--mu)}
.code{border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:12px 0;background:#0b0812}.code .ch{display:flex;justify-content:space-between;align-items:center;padding:5px 8px 5px 14px;background:#1a1227;font-size:12px;color:var(--mu)}.code .ch div{display:flex;gap:4px;align-items:center}.code .ch button{position:static;font-size:12px;background:none;color:var(--mu);padding:5px 8px}.code pre{border:0;border-radius:0;background:#0b0812;padding:14px;margin:0;overflow-x:auto}.code code.hljs{background:none;padding:0}
.act{opacity:.72;font-size:14px;display:flex;gap:6px;margin-top:7px}.act button{border:1px solid #ffffff12;background:#ffffff08;padding:5px 9px;font-size:12px}.err{color:#ff8eaa;white-space:pre-wrap}.att{font-size:13px;color:var(--mu);margin-top:5px}
#hello{text-align:center;color:var(--fg);margin:10vh auto 0;max-width:720px}#hello>svg{filter:drop-shadow(0 0 28px #9b68ff77)}#hello h2{font-weight:650;font-size:clamp(25px,4vw,36px);margin:18px 12px 5px;line-height:1.2;letter-spacing:-.8px;background:linear-gradient(100deg,#fff,#c8aaff 70%,#a77bff);background-clip:text;color:transparent}
#chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 12px;max-width:840px;margin:0 auto;width:100%}#chips span{background:#211832;border:1px solid #a77bff2b;border-radius:11px;padding:5px 11px;font-size:12px;cursor:pointer;color:#d7c8ef}
#bar{display:flex;align-items:flex-end;gap:5px;margin:10px auto 12px;padding:9px 11px;max-width:820px;width:calc(100% - 30px);background:linear-gradient(145deg,#1c142a,#151020);border:1px solid #a77bff4d;border-radius:22px;box-shadow:0 10px 42px #0007,0 0 28px #8151d51a}#inp{flex:1;border:0;outline:0;background:none;resize:none;max-height:160px;padding:9px 5px;color:#f5efff}#inp::placeholder{color:#9183a6}
#bar button{font-size:17px;padding:8px 10px;border-radius:13px;color:#bba8d9}#bar button:hover,#bar .on{background:#8c5be42b;color:#d8c3ff}#bar button#go{background:linear-gradient(135deg,#b38aff,#7446d9);color:#fff;width:41px;height:41px;padding:0;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 16px #7446d955}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:28px auto 0;padding:0 12px}.cards div{background:linear-gradient(145deg,#1e1630,#151020);border:1px solid #a77bff2c;border-radius:15px;padding:15px;text-align:left;cursor:pointer;font-size:13px;line-height:1.45;color:#b9accb;transition:.18s}.cards div:hover{border-color:#a77bff;transform:translateY(-2px);background:#261a3b}.cards b{display:block;font-size:21px;margin-bottom:6px;color:#e5d7ff}
#pv{width:94%;max-width:900px;height:80vh;padding:0;background:#171126;color:var(--fg);border:1px solid var(--bd);border-radius:16px}#pvf{width:100%;height:calc(100% - 44px);border:0;background:#fff}#shade{display:none}
dialog{background:#171126;color:var(--fg);border:1px solid #a77bff55;border-radius:18px;box-shadow:0 24px 80px #000b;width:min(92vw,520px);padding:22px}dialog::backdrop{background:#05030bcc;backdrop-filter:blur(5px)}dialog input,dialog textarea{width:100%;background:#0e0a17;border:1px solid #44315d;border-radius:10px;padding:10px;outline:0}dialog label{color:#d9c8f3;font-size:13px}dialog small{color:#9f91b3}dialog a{color:#c2a3ff}
@media(max-width:760px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.2s;padding-top:calc(14px + env(safe-area-inset-top))}#side.open{transform:none}#shade.open{display:block;position:fixed;inset:0;background:#0009;z-index:4}#menu{display:block}header{padding:12px 14px}#msgs{padding:16px 12px}#hello{margin-top:9vh}#bar{width:calc(100% - 18px);margin-bottom:8px;padding:7px}#bar button{padding:7px 8px}#chips{padding:0 10px}.cards{gap:8px}.cards div{padding:12px}}</style>

 <button class="nb" onclick="nc()">+ Yeni sohbet</button>
 <input id="q" placeholder="Sohbetlerde ara" oninput="render()">
 <div id="list"></div>
 <button onclick="openSet()">⚙ Ayarlar</button>

<main>
 <header>
  <button id="menu" onclick="tg()">☰</button><svg width="24" height="24" viewBox="0 0 64 64"><defs><mask id="mh"><rect width="64" height="64" fill="#fff"/><circle cx="40" cy="26" r="20" fill="#000"/></mask></defs><circle cx="28" cy="32" r="22" fill="#c5a7ff" mask="url(#mh)"/><path d="M48 14l2.2 5.8L56 22l-5.8 2.2L48 30l-2.2-5.8L40 22l5.8-2.2z" fill="#c5a7ff"/></svg><b id="ttl">Linay</b>
 </header>
 <div id="msgs"></div>
 <div id="chips"></div>
 <div id="bar">
  <button onclick="$('f').click()" title="Dosya / fotoğraf">📎</button>

 </div>
 <input type="file" id="f" hidden multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.py,.html,.css,.java,.c,.cpp,.docx,.xlsx,.tsv">
</main>
<dialog id="dl">
 <h3 style="margin-top:0">Ayarlar <small style="color:var(--mu);font-weight:400">v2.1</small></h3>
 <div id="keybox"><label>Gemini API anahtarı</label>
 <input id="key" type="password" placeholder="API anahtarı" autocomplete="off">
 <small>Ücretsiz: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Anahtar sadece bu cihazda saklanır.</small></div>
 <label style="display:block;margin-top:12px">Model</label>
 <input id="model" list="ml"><datalist id="ml"><option value="gemini-flash-lite-latest"><option value="gemini-flash-latest"><option value="gemini-2.5-flash"><option value="gemini-2.5-pro"></datalist>
 <label style="display:block;margin-top:12px">Linay hafızası</label>
 <textarea id="memory" rows="4" placeholder="Linay’in sonraki sohbetlerde hatırlamasını istediğin bilgileri buraya yaz…"></textarea>
 <small>Bu bilgiler bu cihazın tarayıcısında saklanır ve yeni sohbetlerde kullanılır.</small>
 <div style="display:flex;gap:8px;justify-content:space-between">
  <button onclick="if(confirm('Tüm sohbetler silinsin mi?')){S.chats=[];S.cur=null;save();render();dl.close()}">Sohbetleri sil</button>
  <button class="nb" onclick="saveSet()">Kaydet</button>
 </div>
</dialog>
<dialog id="pv"><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 14px"><b>Önizleme</b><button onclick="$('pv').close()">✕</button></div><iframe id="pvf" sandbox="allow-scripts"></iframe></dialog>
<script>window.onerror=function(m,s,l){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#e8707a;color:#000;padding:8px 12px;font:13px system-ui';d.textContent='Kod hatası: '+m+' (satır '+l+')';document.body.appendChild(d)}</script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),dl=$('dl'),inp=$('inp');
let S=JSON.parse(localStorage.getItem('ai1')||'null')||{chats:[],cur:null,cfg:{key:'',model:'gemini-flash-lite-latest',mode:'gen',search:false,v:2}};
if(S.cfg.v!==2){S.cfg.v=2;S.cfg.model='gemini-flash-lite-latest';S.cfg.search=false}if(typeof S.cfg.memory!=='string')S.cfg.memory='';
const RAW=String(window.LINAY_PROXY||window.LINAY_KEY||'').trim();
const PROXY=/^https?:\/\//i.test(RAW)?RAW.replace(/\/+$/,''):'';
const BUILT=PROXY?'':String(window.LINAY_KEY||'').trim();
const KEY=()=>BUILT||S.cfg.key;
const HDR=()=>PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json','x-goog-api-key':KEY()};
let imgMode=false;
const IMG_RE=/(resim|resm\w*|görsel|fotoğraf|foto|logo|poster|illüstrasyon|çizim|image|picture)\w*\s+(yap|çiz|oluştur|üret|hazırla|tasarla|generate|create|make)|(^|\s)çiz(er\s*misin)?([\s.!?]|$)|\b(draw|generate|create|make)\b.{0,15}\b(image|picture|photo|logo|drawing)\b/i;
let files=[],busy=false,ctl=null;
const GEN="Sen Linay'sın: kod yazma, analiz, yazı yazma, öğrenme, günlük sorular ve resim üretme konularında yardım eden, net, dürüst ve sıcak bir yapay zekâ asistanısın. Kullanıcının dilinde (Türkçe/İngilizce) yanıtla. Kod yazarken tam ve çalışır kod ver, dil etiketli kod bloğu kullan, kısaca açıkla; web sayfası, oyun veya arayüz istenirse tek dosyalık HTML ver. Gerektiğinde başlık, madde ve tablo kullan ama gereksiz uzatma. Emin olmadığın şeyi uydurma, bilmiyorsan söyle. Kullanıcı resim, logo veya çizim isterse resim çizemediğini ASLA söyleme: yanıtına tam olarak şu satırı yaz: [RESIM: ayrıntılı İngilizce prompt] ve altına kısa bir cümle ekle.";
const save=()=>{try{localStorage.setItem('ai1',JSON.stringify({...S,chats:S.chats.map(c=>({...c,msgs:c.msgs.map(m=>({...m,parts:m.parts.map(p=>p.inlineData?{text:'[Ek dosya gönderilmişti]'}:p)}))}))}))}catch(e){}};
const cur=()=>S.chats.find(c=>c.id===S.cur);
const FB='gemini-flash-lite-latest';
const CARDS='<div class="cards">'+[['💻','Kod yaz','Python ile basit bir hesap makinesi yaz ve açıkla'],['🎨','Resim oluştur','Gün batımında sahilde yürüyen bir astronot resmi yap'],['🧠','Bir şey öğren','Kuantum bilgisayarlar nasıl çalışır? Basitçe anlat'],['✍️','Yazı yaz','Profesyonel ve kibar bir e-posta yaz']].map(([i,t,p])=>`<div data-p="${p}"><b>${i}</b>${t}</div>`).join('')+'</div>';
function logo(n,id){return `<svg width="${n}" height="${n}" viewBox="0 0 64 64"><defs><mask id="${id}"><rect width="64" height="64" fill="#fff"/><circle cx="40" cy="26" r="20" fill="#000"/></mask></defs><circle cx="28" cy="32" r="22" fill="#c5a7ff" mask="url(#${id})"/><path d="M48 14l2.2 5.8L56 22l-5.8 2.2L48 30l-2.2-5.8L40 22l5.8-2.2z" fill="#c5a7ff"/></svg>`}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md0(t){
 const b=[];
 t=t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{b.push(`<div class="code"><div class="ch"><span>${l||'kod'}</span><div><button data-a="dl">İndir</button><button data-a="cp">Kopyala</button></div></div><pre><code>${esc(c)}</code></pre></div>`);return '\u0000'+(b.length-1)+'\u0000'});
 t=esc(t).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*(?!\s)([^*\n]+?)\*/g,'$1<i>$2</i>')
  .replace(/^#{1,6} (.+)$/gm,'<h4>$1</h4>').replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>')
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
 return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>b[i]);
}
let MD=!!(window.marked&&window.hljs&&window.DOMPurify);
if(MD){
 marked.use({renderer:{code(code,lang){
  const l=(lang||'').split(/\s/)[0];let h;
  try{h=l&&hljs.getLanguage(l)?hljs.highlight(code,{language:l}).value:hljs.highlightAuto(code).value}catch(e){h=esc(code)}
  const pv=/^(html|svg)$/i.test(l)?'<button data-a="pv">▶ Önizle</button>':'';
  return `<div class="code"><div class="ch"><span>${l||'kod'}</span><div>${pv}<button data-a="dl">İndir</button><button data-a="cp">Kopyala</button></div></div><pre><code class="hljs">${h}</code></pre></div>`}}});
 DOMPurify.addHook('afterSanitizeAttributes',n=>{if(n.tagName=='A'){n.setAttribute('target','_blank');n.setAttribute('rel','noopener')}});
}
function md(t){if(!MD)return md0(t);try{return DOMPurify.sanitize(marked.parse(t,{breaks:true}))}catch(e){return md0(t)}}
const say=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[`*#]/g,''));u.lang=/[çğıöşüÇĞİÖŞÜ]/.test(t)?'tr-TR':'en-US';speechSynthesis.speak(u)};
function tg(o){$('side').classList.toggle('open',o);$('shade').classList.toggle('open',o)}
function nc(){S.cur=null;render();tg(false);inp.focus()}
function add(role,html,last){
 const w=document.createElement('div');w.className='w';
 const d=document.createElement('div');d.className=role=='user'?'u':'a';d.innerHTML=html;w.appendChild(d);
 if(role!='user'){const a=document.createElement('div');a.className='act';a.innerHTML='<button>🔊</button><button>📋</button>'+(last?'<button>🔄</button>':'');
  a.children[0].onclick=()=>say(d.innerText);a.children[1].onclick=()=>navigator.clipboard.writeText(d.innerText);if(last)a.children[2].onclick=regen;w.appendChild(a)}
 $('msgs').appendChild(w);return d;
}
function render(){
 const c=cur();$('ttl').textContent=c?c.title:'Linay';$('web').classList.toggle('on',S.cfg.search);
 $('list').innerHTML='';
 const q=($('q').value||'').toLowerCase();S.chats.slice().reverse().filter(x=>!q||(x.title+' '+x.msgs.map(m=>m.text||m.t||'').join(' ')).toLowerCase().includes(q)).forEach(x=>{const r=document.createElement('div');r.className='ci'+(x.id==S.cur?' on':'');
  r.innerHTML='<span></span><button>✕</button>';r.firstChild.textContent=x.title;
  r.firstChild.onclick=()=>{S.cur=x.id;render();tg(false)};
  r.lastChild.onclick=()=>{S.chats=S.chats.filter(y=>y.id!=x.id);if(S.cur==x.id)S.cur=null;save();render()};
  $('list').appendChild(r)});
 const m=$('msgs');m.innerHTML='';
 if(!c||!c.msgs.length)m.innerHTML='<div id="hello">'+logo(80,'mx')+"<h2>Bugün aklında ne var?</h2>"+CARDS+'</div>';
 else c.msgs.forEach((x,i)=>x.role=='user'?add('user',esc(x.t||'')+(x.att&&x.att.length?`<div class="att">📎 ${esc(x.att.join(', '))}</div>`:'')):add('model',md(x.text),i==c.msgs.length-1));
 m.querySelectorAll('.cards div').forEach(d=>d.onclick=()=>{inp.value=d.dataset.p;inp.focus();grow()});m.scrollTop=m.scrollHeight;
}
function chips(){$('chips').innerHTML='';files.forEach((f,i)=>{const s=document.createElement('span');s.textContent='📎 '+f.name+' ✕';s.onclick=()=>{files.splice(i,1);chips()};$('chips').appendChild(s)})}
$('f').onchange=async e=>{
 for(const f of e.target.files){
  if(f.size>15e6){alert(f.name+' çok büyük (en fazla 15 MB)');continue}
  if(/^image\/|pdf$/.test(f.type)){const d=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});files.push({name:f.name,part:{inlineData:{mimeType:f.type,data:d}}})}
  else if(/\.docx$/i.test(f.name)&&window.mammoth){const z=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});files.push({name:f.name,part:{text:`[Word belgesi: ${f.name}]\n${z.value.slice(0,100000)}`}})}
  else if(/\.xlsx$/i.test(f.name)&&window.XLSX){const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const t=wb.SheetNames.map(n=>`## ${n}\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}`).join('\n\n');files.push({name:f.name,part:{text:`[Excel çalışma kitabı: ${f.name}]\n${t.slice(0,100000)}`}})}
  else{const t=await f.text();files.push({name:f.name,part:{text:`[Dosya: ${f.name}]\n${t.slice(0,100000)}`}})}
 }
 e.target.value='';chips();
};
function regen(){if(busy)return;const c=cur();if(!c)return;while(c.msgs.length&&c.msgs[c.msgs.length-1].role=='model')c.msgs.pop();const u=c.msgs.pop();if(!u)return;inp.value=u.t||'';send()}
async function enPrompt(t){
 try{
  const r=await fetch(`${PROXY||'https://generativelanguage.googleapis.com'}/v1beta/models/${FB}:streamGenerateContent?alt=sse`,{method:'POST',headers:HDR(),signal:AbortSignal.timeout(15000),
   body:JSON.stringify({systemInstruction:{parts:[{text:"Kullanıcının isteğini bir yapay zeka resim üretici için tek paragraflık, ayrıntılı bir İngilizce prompta çevir. Sadece promptu yaz, başka hiçbir şey yazma."}]},contents:[{role:'user',parts:[{text:t}]}]})});
  if(!r.ok)return t;
  let o='';(await r.text()).split('\n').forEach(l=>{if(l.startsWith('data:'))try{const j=JSON.parse(l.slice(5));o+=(j.candidates[0].content.parts||[]).map(x=>x.text||'').join('')}catch(e){}});
  return o.trim()||t;
 }catch(e){return t}
}
async function genImg(text,el,raw){
 el.innerHTML='<span style="color:var(--mu)">Resim hazırlanıyor… (10-40 sn)</span>';
 const p=raw?text:await enPrompt(text);let src=null,werr='';
 if(PROXY){try{
  const r=await fetch(PROXY+'/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p}),signal:AbortSignal.timeout(90000)});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.image)src='data:'+(j.type||'image/jpeg')+';base64,'+j.image;else werr=j.error||('HTTP '+r.status);
 }catch(e){werr=String(e.message||e)}}
 const dl=!!src;
 if(!src)src='https://image.pollinations.ai/prompt/'+encodeURIComponent(p).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase())+'?width=1024&height=1024&nologo=true&seed='+Math.floor(Math.random()*1e6);
 el.innerHTML=`<div style="margin:10px 0;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background:var(--card);padding:10px;width:fit-content;max-width:100%"><img src="${src}" alt="" style="max-width:100%;max-height:500px;border-radius:10px;display:block">`+(dl?`<div style="margin-top:8px"><a download="linay.jpg" href="${src}" style="background:var(--ub);padding:6px 12px;border-radius:8px;font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--bd)">İndir</a></div>`:'')+`<div class="att">${esc(p)}</div></div>`+(werr&&!dl?`<div class="att">Not: ana resim servisi çalışmadı (${esc(werr)}), yedek servis kullanıldı.</div>`:'');
 el.querySelector('img').onerror=()=>{el.innerHTML='Resim oluşturulamadı.'+(werr?`<div class="att">Resim servisi hatası: ${esc(werr)}</div>`:'')+'<div class="att">Biraz sonra tekrar dene.</div>'};
 return p;
}
async function send(){
 if(busy){ctl&&ctl.abort();return}
 const text=inp.value.trim();if(!text&&!files.length)return;
 if(!KEY()&&!PROXY){openSet();return}
 let c=cur();
 if(!c){c={id:Date.now(),title:(text||files[0].name).slice(0,40),msgs:[]};S.chats.push(c);S.cur=c.id}
 const parts=files.map(f=>f.part);if(text)parts.push({text});
 const um={role:'user',parts,t:text,att:files.map(f=>f.name)};c.msgs.push(um);
 const sf=files;files=[];chips();inp.value='';grow();render();
 const el=add('model','<span style="color:var(--mu)">Linay düşünüyor…</span>');busy=true;$('go').textContent='■';ctl=new AbortController();
 if(text&&(imgMode||(!sf.length&&text.length<200&&IMG_RE.test(text)))){
  imgMode=false;$('img').classList.remove('on');
  const p=await genImg(text,el);
  c.msgs.push({role:'model',parts:[{text:'[Resim oluşturuldu: '+p+']'}],text:'🖼 Resim oluşturuldu: '+p});
  busy=false;$('go').textContent='➤';save();return;
 }
 let out='',src=new Map(),shown=false;
 try{
  const body={systemInstruction:{parts:[{text:GEN+' Bugün: '+new Date().toLocaleDateString('tr-TR')+(S.cfg.memory?'\n\nKULLANICI HAFIZASI (önceki sohbetlerden kaydedilmiş bilgiler):\n'+S.cfg.memory+'\nBu bilgileri yalnızca ilgili olduğunda kullan; kullanıcıya her seferinde tekrar etme.':'')}]}, 
   contents:c.msgs.map(m=>({role:m.role,parts:m.parts}))};
  const tries=[[S.cfg.model,S.cfg.search]];
  if(S.cfg.search)tries.push([S.cfg.model,false]);
  [FB,'gemini-flash-latest'].forEach(x=>{if(x!=S.cfg.model)tries.push([x,false])});
  let r,note='';
  for(const [mdl,se] of tries){
   const b2={...body};if(se)b2.tools=[{google_search:{}}];
   const ac=new AbortController(),onab=()=>ac.abort();ctl.signal.addEventListener('abort',onab);
   const to=setTimeout(()=>ac.abort(),30000);
   try{
    r=await fetch(`${PROXY||'https://generativelanguage.googleapis.com'}/v1beta/models/${mdl}:streamGenerateContent?alt=sse`,
     {method:'POST',signal:ac.signal,headers:PROXY?{'Content-Type':'application/json'}:{'Content-Type':'application/json','x-goog-api-key':KEY()},body:JSON.stringify(b2)});
   }catch(e){
    clearTimeout(to);
    if(ctl.signal.aborted)throw e;
    r={ok:false,status:408,msg:e.name=='AbortError'?'Yanıt çok gecikti.':'Bağlantı kurulamadı ('+e.message+'). İnterneti, API anahtarını veya proxy adresini kontrol et.'};continue;
   }
   clearTimeout(to);
   if(r.ok){if(mdl!=S.cfg.model||se!=S.cfg.search)note="\n\n*(Yoğunluk nedeniyle alternatif modelle yanıtlandı.)*";break}
   let m=r.status+'';try{m=(await r.json()).error.message}catch(e){}
   if(!(/^(404|408|429|500|503|504)$/.test(r.status)||/quota|demand|overload|unavailable/i.test(m)))throw new Error(m);
   r.msg=m;
  }
  if(!r.ok)throw new Error(r.msg||('Hata '+r.status));
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){
   const {done,value}=await rd.read();if(done)break;
   buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
   for(const l of ls){if(!l.startsWith('data:'))continue;
    let j;try{j=JSON.parse(l.slice(5))}catch(e){continue}
    if(j.error)throw new Error(j.error.message);
    try{const k=j.candidates&&j.candidates[0]||{};
     out+=((k.content&&k.content.parts||[]).map(x=>x.text||'').join(''));
     (k.groundingMetadata&&k.groundingMetadata.groundingChunks||[]).forEach(g=>g.web&&src.set(g.web.uri,g.web.title));
     el.innerHTML=md(out);$('msgs').scrollTop=$('msgs').scrollHeight}catch(e){}}
  }
  if(!out)out='(Boş yanıt geldi, tekrar dene.)';
  out+=note;
  const mi=out.match(/\[RESIM:\s*([^\]]+)\]/i);
  if(mi){out=out.replace(mi[0],'').trim();el.innerHTML=md(out);const ie=add('model','');const ip=await genImg(mi[1].trim(),ie,true);out+='\n\n🖼 *Resim oluşturuldu: '+ip+'*';shown=true}
  if(src.size)out+='\n\n**Kaynaklar:** '+[...src].slice(0,5).map(([u,t])=>`[${t||'kaynak'}](${u})`).join(' · ');
  c.msgs.push({role:'model',parts:[{text:out}],text:out});
 }catch(e){
  if(e.name=='AbortError'){if(out)c.msgs.push({role:'model',parts:[{text:out}],text:out});else c.msgs.pop()}
  else{c.msgs.pop();files=sf;chips();inp.value=text;el.className='a err';el.textContent='Hata: '+e.message}
 }
 busy=false;$('go').textContent='➤';save();
 if(!el.classList.contains('err')&&!shown)render();
}
function openSet(){$('keybox').style.display=(BUILT||PROXY)?'none':'';$('key').value=S.cfg.key;$('model').value=S.cfg.model;$('memory').value=S.cfg.memory||'';tg(false);dl.showModal()}
function saveSet(){if(!BUILT)S.cfg.key=$('key').value.trim();S.cfg.model=$('model').value.trim()||'gemini-flash-lite-latest';S.cfg.memory=$('memory').value.trim().slice(0,6000);save();dl.close()}
const grow=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};
inp.oninput=grow;
inp.onkeydown=e=>{if(e.key=='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send()}};
$('go').onclick=send;
$('img').onclick=()=>{imgMode=!imgMode;$('img').classList.toggle('on',imgMode);if(imgMode)inp.placeholder='Nasıl bir resim istiyorsun?';else inp.placeholder='Bir şey sor…'};
$('web').onclick=()=>{S.cfg.search=!S.cfg.search;$('web').classList.toggle('on',S.cfg.search);save()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
$('mic').onclick=()=>{
 if(!SR)return alert('Bu tarayıcı sesle yazmayı desteklemiyor.');
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='tr-TR';
 rec.onresult=e=>{inp.value+=(inp.value?' ':'')+e.results[0][0].transcript;grow()};
 rec.onend=()=>{rec=null;$('mic').classList.remove('on')};rec.start();$('mic').classList.add('on');
};
$('msgs').addEventListener('click',e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const codeBlock=b.closest('.code');
 const code=codeBlock.querySelector('code').innerText;
 if(b.dataset.a=='cp'){
  navigator.clipboard.writeText(code);b.textContent='Kopyalandı';setTimeout(()=>b.textContent='Kopyala',1200);
 }else if(b.dataset.a=='dl'){
  const lang=(codeBlock.querySelector('.ch span').innerText.trim()||'txt').toLowerCase();
  const ext=lang==='html'||lang==='svg'?lang:lang==='python'||lang==='py'?'py':lang==='javascript'||lang==='js'?'js':'txt';
  const blob=new Blob([code],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`linay-kod.${ext}`;a.click();
  URL.revokeObjectURL(url);
 }else{
  $('pvf').srcdoc=code;$('pv').showModal();
 }
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(!KEY()&&!PROXY)setTimeout(openSet,300);
</script></body></html>
